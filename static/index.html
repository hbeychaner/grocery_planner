<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grocery Price Comparator — Košík vs. Rohlík</title>
  <link rel="stylesheet" href="/static/style.css?v=1.1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-icon">🛒</span>
        <div>
          <h1>Grocery Price Comparator</h1>
          <p class="subtitle">Košík.cz vs. Rohlík.cz &bull; <span class="badge-location">📍 Prague (Vinohrady)</span></p>
        </div>
      </div>
      <div class="header-actions">
        <a href="/trends" class="btn btn-primary">📈 Price Trends</a>
        <a href="/docs" target="_blank" class="btn btn-outline">API Docs</a>
      </div>
    </header>

    <!-- Search Section -->
    <section class="search-section">
      <form id="search-form" class="search-form">
        <div class="search-input-wrapper">
          <span class="search-icon">🔍</span>
          <input 
            type="text" 
            id="search-input" 
            placeholder="Search any product (e.g., 'butter', 'whole milk', 'eggs', 'pilsner urquell')..." 
            autocomplete="off" 
            required 
          />
          <button type="submit" id="search-btn" class="btn btn-accent">Compare</button>
        </div>
      </form>

      <!-- Quick Staples Chips -->
      <div class="staples-wrapper">
        <span class="staples-label">Quick Staples:</span>
        <div id="staples-list" class="staples-chips">
          <button class="chip" data-query="butter">🧈 Butter</button>
          <button class="chip" data-query="whole milk">🥛 Milk</button>
          <button class="chip" data-query="eggs">🥚 Eggs</button>
          <button class="chip" data-query="pilsner urquell">🍺 Pilsner</button>
          <button class="chip" data-query="bananas">🍌 Bananas</button>
        </div>
      </div>
    </section>

    <!-- Loader -->
    <div id="loader" class="loader-container hidden">
      <div class="spinner"></div>
      <p>Querying Rohlík and Košík in parallel...</p>
    </div>

    <!-- Results Section -->
    <main id="results-section" class="results-section hidden">
      <!-- Comparison Winner Announcement -->
      <div id="winner-banner" class="winner-banner"></div>

      <!-- Side by Side Product Grid -->
      <div class="comparison-grid">
        <!-- Rohlik Card -->
        <div class="store-card" id="card-rohlik">
          <div class="store-badge rohlik-badge">
            <span class="store-dot"></span> Rohlík.cz
          </div>
          <div class="card-content" id="rohlik-content">
            <!-- Dynamically populated -->
          </div>
        </div>

        <!-- Kosik Card -->
        <div class="store-card" id="card-kosik">
          <div class="store-badge kosik-badge">
            <span class="store-dot"></span> Košík.cz
          </div>
          <div class="card-content" id="kosik-content">
            <!-- Dynamically populated -->
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>Grocery Price Comparator &bull; Built with FastAPI, Pydantic & Docker</p>
    </footer>
  </div>

  <script src="/static/app.js?v=1.2"></script>
</body>
</html>
